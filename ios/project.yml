name: QibanCompanion
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    STORAGE_NAMESPACE: QibanCompanion
    KEYCHAIN_SERVICE: com.local.qibancompanion.api
    COMPAT_APP_BUNDLE: com.local.qibancompanion
    TARGETED_DEVICE_FAMILY: "1"
targets:
  QibanCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated/SPEECH-LICENSES.txt
        buildPhase: resources
      - path: WebAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMPAT_APP_BUNDLE)
        MARKETING_VERSION: "0.26.0"
        CURRENT_PROJECT_VERSION: "44"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
      - framework: Generated/QibanG2P.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libz.tbd
    info:
      path: Generated/Info.plist
      properties:
        StorageNamespace: $(STORAGE_NAMESPACE)
        KeychainService: $(KEYCHAIN_SERVICE)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: 仅在你连接局域网的 MCP 工具、模型或 WebDAV 服务时访问对应设备；本地通讯页面只监听本机回环地址。
        NSPhotoLibraryUsageDescription: 由你选择要发送的照片、角色头像或表情，确认发送后交给你配置的服务处理。
        CFBundleDisplayName: 栖伴
        NSMicrophoneUsageDescription: 语音通话和环境反馈默认在本机识别；启用独立ASR后，每段录音会上传到你指定的识别接口。识别文字和声音类别可用于AI对话。
        NSSpeechRecognitionUsageDescription: 在设备支持时将你的语音本机转成对话文字。
        NSCameraUsageDescription: 开启视频后使用后置主摄预览；发送对话或点击看看镜头时，将一张当前画面发往你配置的AI接口识图，不保存视频。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.qiban.chatmodule
            UTTypeDescription: 栖伴本地通讯模块
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [qchat]
          - UTTypeIdentifier: com.qiban.offlinevoice
            UTTypeDescription: 栖伴离线语音包
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [qvoice]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  QibanCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: QibanCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  QibanCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: QibanCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QibanCompanion:
    build:
      targets:
        QibanCompanion: all
    test:
      targets: [QibanCompanionTests, QibanCompanionUITests]
