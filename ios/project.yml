name: AnimatesLocal
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  ONNXRuntime:
    url: https://github.com/xieanranya/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    STORAGE_NAMESPACE: AnimatesLocal
    KEYCHAIN_SERVICE: com.local.animatescompanion.api
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AnimatesLocal:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated/SPEECH-LICENSES.txt
        buildPhase: resources
      - path: WebAssets
        type: folder
        buildPhase: resources
      - path: ../games/tycoon
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.animatescompanion
        MARKETING_VERSION: "0.41.0"
        CURRENT_PROJECT_VERSION: "67"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
      - framework: Generated/QibanG2P.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: JavaScriptCore.framework
    info:
      path: Generated/Info.plist
      properties:
        StorageNamespace: $(STORAGE_NAMESPACE)
        KeychainService: $(KEYCHAIN_SERVICE)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: 用于手机创建牌桌房间、发现附近朋友并在同一 Wi-Fi／手机热点内联机，也用于你选择的 MCP、模型或 WebDAV 服务。
        NSBonjourServices: [_qiban-cards._tcp]
        NSPhotoLibraryUsageDescription: 由你选择要发送的照片、角色头像或表情，确认发送后交给你配置的服务处理。
        CFBundleDisplayName: 栖伴
        NSMicrophoneUsageDescription: 语音通话和环境反馈默认在本机识别；启用独立ASR后，每段录音会上传到你指定的识别接口。识别文字和声音类别可用于AI对话。
        NSSpeechRecognitionUsageDescription: 在设备支持时将你的语音本机转成对话文字。
        NSCameraUsageDescription: 开启视频后使用后置主摄预览；发送对话或点击看看镜头时，将一张当前画面发往你配置的AI接口识图，不保存视频。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.qiban.portraitstage
            UTTypeDescription: 栖伴2D动态立绘素材包
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [qstage]
          - UTTypeIdentifier: com.qiban.cardart
            UTTypeDescription: 栖伴牌桌立绘包
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [qcards]
          - UTTypeIdentifier: com.qiban.chatmodule
            UTTypeDescription: 栖伴本地通讯模块
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [qchat]
          - UTTypeIdentifier: com.qiban.offlinevoice
            UTTypeDescription: 栖伴离线语音包
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [qvoice]
          - UTTypeIdentifier: com.qiban.universalmotion
            UTTypeDescription: 栖伴通用3D动作包
            UTTypeConformsTo: [public.data, public.json]
            UTTypeTagSpecification:
              public.filename-extension: [qmotion]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  AnimatesLocalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AnimatesLocal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnimatesLocalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AnimatesLocal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AnimatesLocal:
    build:
      targets:
        AnimatesLocal: all
    test:
      targets: [AnimatesLocalTests, AnimatesLocalUITests]
