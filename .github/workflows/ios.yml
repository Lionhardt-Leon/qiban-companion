name: Qiban Companion iOS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      COMPAT_BUNDLE: ${{ secrets.COMPAT_BUNDLE }}
      COMPAT_STORAGE: ${{ secrets.COMPAT_STORAGE }}
      COMPAT_KEYCHAIN: ${{ secrets.COMPAT_KEYCHAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native offline speech SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch-g2p-sdk.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify speech cancellation lifecycle
        run: python3 tools/probe-speech-cancellation.py
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Verify dance playback clock
        run: node tools/test-dance-clock.mjs
      - name: Run core tests
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "QIBAN_TEST_DEVICE=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -project QibanCompanion.xcodeproj -scheme QibanCompanion -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:QibanCompanionTests -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -resultBundlePath CoreTests.xcresult COMPAT_APP_BUNDLE="$COMPAT_BUNDLE" STORAGE_NAMESPACE="$COMPAT_STORAGE" KEYCHAIN_SERVICE="$COMPAT_KEYCHAIN" CODE_SIGNING_ALLOWED=NO
      - name: Run UI tests in fresh simulator process
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl shutdown all
          xcrun simctl bootstatus "$QIBAN_TEST_DEVICE" -b
          xcodebuild test -project QibanCompanion.xcodeproj -scheme QibanCompanion -destination "platform=iOS Simulator,id=$QIBAN_TEST_DEVICE" -only-testing:QibanCompanionUITests -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -resultBundlePath UITestResults.xcresult COMPAT_APP_BUNDLE="$COMPAT_BUNDLE" STORAGE_NAMESPACE="$COMPAT_STORAGE" KEYCHAIN_SERVICE="$COMPAT_KEYCHAIN" CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project QibanCompanion.xcodeproj -scheme QibanCompanion -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build COMPAT_APP_BUNDLE="$COMPAT_BUNDLE" STORAGE_NAMESPACE="$COMPAT_STORAGE" KEYCHAIN_SERVICE="$COMPAT_KEYCHAIN" CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QibanCompanion.app Payload/
          zip -qry QibanCompanion-unsigned.ipa Payload
      - name: Save failed UI evidence to private draft
        if: failure()
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT=UITestResults.xcresult
          if [ ! -d "$RESULT" ]; then RESULT=CoreTests.xcresult; fi
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool export attachments --path "$RESULT" --output-path failed-ui-evidence
            zip -qry Failed-UI-evidence.zip failed-ui-evidence
            TAG="qiban-local-failed-${GITHUB_RUN_ID}"
            gh release create "$TAG" --draft --target '${{ github.sha }}' --title "Failed UI test evidence ${GITHUB_RUN_ID}" --notes 'Synthetic test fixtures only. No IPA delivery.'
            gh release upload "$TAG" Failed-UI-evidence.zip
          fi
      - name: Save unsigned IPA to private draft release
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          TAG="qiban-local-${SHA}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --draft --target '${{ github.sha }}' --title "Qiban Local ${SHA}" --notes 'Private unsigned iOS preview. Not device verified.'
          gh release upload "$TAG" QibanCompanion-unsigned.ipa
          xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path ui-evidence
          zip -qry UI-evidence.zip ui-evidence
          gh release upload "$TAG" UI-evidence.zip
          echo "Private draft release: $TAG" >> "$GITHUB_STEP_SUMMARY"
