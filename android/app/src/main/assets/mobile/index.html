<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#231d2d"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'"><title>栖伴</title><link rel="stylesheet" href="home.css"><script src="ui-icons.js"></script></head>
<body><iframe id="model" title="本地角色"></iframe><div id="empty"><i data-icon="person.crop.circle"></i><p>把你的伙伴带到这里</p><button data-do="appearance" class="primary">导入伙伴</button></div>
<header id="home-header" aria-label="陪伴主页"><nav class="home-left"><button class="circle" data-do="settings" aria-label="设置"><i data-icon="gearshape"></i></button><button class="circle" data-do="actions" aria-label="动作"><i data-icon="figure.dance"></i></button><button class="circle" id="ar-btn" data-do="ar-toggle" aria-label="AR 现实投射" hidden><i data-icon="arkit"></i></button></nav><div class="brand">栖伴<small>LOCAL</small></div><nav class="home-right"><button class="circle" data-do="diary" aria-label="日记"><i data-icon="person.crop.circle"></i></button><button class="circle" data-do="images" aria-label="图片与自身形象"><i data-icon="photo.badge.plus"></i></button><button class="circle" data-do="display-menu" aria-label="旋转与桌宠模式"><i data-icon="rotate"></i></button></nav></header>
<div id="ar-hud" hidden><div class="ar-strip"><button class="ar-pill" data-do="ar-toggle">退出AR</button><button class="ar-pill" id="ar-chibi-btn" data-do="toggle-chibi">1:1原比</button><button class="ar-pill" id="ar-preset-btn" data-do="ar-preset">桌面手办</button><button class="ar-pill" id="ar-adjust-btn" data-do="ar-adjust">放置/调高</button><button class="ar-pill" data-do="actions">动作/角色</button><button class="ar-pill" id="ar-vision-btn" data-do="ar-look">看看现实</button><button class="ar-pill" data-do="display-menu">旋转</button><button class="ar-pill" data-do="clean-desk">纯净</button></div><div id="ar-adjust-bar" hidden><p id="ar-hint">对准桌面或地面后点击「确认放置」，支持双指缩放与升降贴地</p><div class="ar-strip"><button class="ar-pill active" id="ar-confirm-btn" data-do="ar-confirm">确认放置</button><button class="ar-pill teal" data-do="ar-snap">重置吸地</button><button class="ar-pill" data-do="ar-down">降落 ↓</button><button class="ar-pill" data-do="ar-up">抬高 ↑</button><button class="ar-pill" data-do="ar-smaller">缩小 -</button><button class="ar-pill" data-do="ar-larger">放大 +</button><button class="ar-pill" data-do="ar-rot-l">左转 ↺</button><button class="ar-pill" data-do="ar-rot-r">右转 ↻</button></div></div></div>
<button id="clean-exit" class="circle" data-do="clean-desk" aria-label="显示界面" hidden><i data-icon="eye.slash"></i></button>
<main id="home-composer"><button id="search" data-do="search" class="search-toggle" hidden><i data-icon="globe"></i><span>联网搜索</span></button><div id="image-preview" hidden></div><button id="greeting" class="plain" data-do="greetings" hidden>使用角色开场白</button><div id="model-label"></div><button id="action-status" data-do="stage-stop" class="status-pill" hidden></button><button id="caption" data-do="messages" hidden></button><button id="sources" data-do="sources" class="plain" hidden></button><button id="thinking" data-do="cancel" class="plain" hidden>正在思考… 点击停止</button><button id="connect-api" data-do="api" class="plain" hidden>在设置中连接你的 API</button><div id="sense-status" class="status-text" role="status"></div><div id="speech-status" class="status-text" role="status"></div><button id="stop-reading" data-do="stop-speech" class="plain" hidden>停止朗读</button><div id="notice" role="status" aria-live="polite"></div><form id="composer"><button class="circle" id="send" aria-label="发送消息"><i data-icon="paperplane"></i></button><textarea id="input" rows="1" placeholder="输入消息……" maxlength="8000"></textarea><button type="button" class="circle" data-do="camera" id="camera" aria-label="开启后置视频"><i data-icon="video.slash"></i></button><button type="button" class="circle" data-do="listen" id="mic" aria-label="开始语音通话"><i data-icon="mic"></i></button></form></main>
<dialog id="panel"><div class="panel-top"><button id="panel-back" data-do="panel-back" aria-label="返回"><i data-icon="chevron.left"></i><span>返回</span></button><h2 id="panel-title"></h2><button data-do="close" class="done">完成</button></div><div id="panel-content"></div></dialog><dialog id="confirmation"><div id="confirmation-content"></div></dialog><input id="photo-file" type="file" accept="image/*" hidden><input id="persona-file" type="file" accept="application/json,.json" hidden><script src="home-loader.js"></script></body></html>
